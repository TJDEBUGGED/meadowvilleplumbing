<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
    <!-- Main Vertical Pipe -->
    <rect x="140" y="20" width="20" height="260" fill="#3E4349" />
    <rect x="135" y="100" width="30" height="15" fill="#00BFFF" />
    
    <!-- Branch Left -->
    <rect x="40" y="100" width="100" height="20" fill="#3E4349" />
    <rect x="40" y="90" width="15" height="40" fill="#2C3035" />
    
    <!-- Branch Right Down -->
    <rect x="160" y="200" width="80" height="20" fill="#3E4349" />
    <rect x="220" y="200" width="20" height="80" fill="#3E4349" />
    <rect x="215" y="195" width="30" height="30" fill="#00BFFF" />
    
    <!-- Drips -->
    <circle cx="230" cy="290" r="5" fill="#00BFFF" />
    <circle cx="230" cy="270" r="3" fill="#00BFFF" />
</svg>
