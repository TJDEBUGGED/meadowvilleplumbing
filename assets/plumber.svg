<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 400" width="100%" height="100%">
    <!-- Hard Hat -->
    <path d="M 60 100 C 60 60, 140 60, 140 100" fill="#00BFFF" />
    <path d="M 50 100 L 160 100 C 165 100, 165 110, 160 110 L 50 110 C 45 110, 45 100, 50 100" fill="#00BFFF" />
    
    <!-- Head / Face -->
    <circle cx="100" cy="130" r="25" fill="#8D5524" />
    <!-- Eyes -->
    <circle cx="115" cy="125" r="3" fill="#3E4349" />
    <circle cx="95" cy="125" r="3" fill="#3E4349" />
    <!-- Smile -->
    <path d="M 95 140 Q 105 150 115 140" fill="none" stroke="#3E4349" stroke-width="2" stroke-linecap="round" />
    
    <!-- Body / Coveralls -->
    <rect x="70" y="160" width="60" height="120" rx="10" fill="#3E4349" />
    <!-- Straps -->
    <rect x="75" y="160" width="10" height="40" fill="#00BFFF" />
    <rect x="115" y="160" width="10" height="40" fill="#00BFFF" />
    
    <!-- Arms -->
    <path d="M 70 170 C 40 180, 50 220, 70 230" fill="none" stroke="#3E4349" stroke-width="20" stroke-linecap="round" />
    <path d="M 130 170 C 160 180, 150 220, 130 230" fill="none" stroke="#3E4349" stroke-width="20" stroke-linecap="round" />
    
    <!-- Hand Left -->
    <circle cx="65" cy="235" r="12" fill="#8D5524" />
    <!-- Hand Right -->
    <circle cx="135" cy="235" r="12" fill="#8D5524" />
    
    <!-- Legs -->
    <rect x="75" y="270" width="20" height="90" fill="#3E4349" />
    <rect x="105" y="270" width="20" height="90" fill="#3E4349" />
    
    <!-- Boots -->
    <path d="M 65 360 L 95 360 L 95 380 L 55 380 Z" fill="#2C3035" rx="5" />
    <path d="M 105 360 L 135 360 L 145 380 L 105 380 الز" fill="#2C3035" rx="5" />
    
    <!-- Tool belt -->
    <rect x="65" y="240" width="70" height="15" rx="5" fill="#8B4513" />
    <rect x="60" y="245" width="10" height="25" fill="#A0522D" rx="2" />
    <rect x="130" y="245" width="10" height="25" fill="#A0522D" rx="2" />
    <circle cx="100" cy="247" r="8" fill="#FFD700" />
</svg>
